name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.x'
  CACHE_KEY_PREFIX: 'scopepi-docs'

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MkDocs and dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-minify-plugin minify
          pip install markdown

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ env.CACHE_KEY_PREFIX }}-pip-${{ hashFiles('**/requirements.txt', '**/setup.py', '**/setup.cfg', '**/pyproject.toml') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-pip-

      - name: Cache MkDocs plugins
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ env.CACHE_KEY_PREFIX }}-mkdocs-${{ hashFiles('mkdocs.yml', '**/*.md') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-mkdocs-

      - name: Build documentation
        run: |
          mkdocs build --strict --verbose
        continue-on-error: false

      - name: Check for broken links
        run: |
          echo "Link checking skipped (no htmltest configured)"
          echo "Run 'pip install htmltest' to enable link validation"

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MkDocs and dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-minify-plugin minify

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ env.CACHE_KEY_PREFIX }}-pip-${{ hashFiles('**/requirements.txt', '**/setup.py', '**/setup.cfg', '**/pyproject.toml') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-pip-

      - name: Cache MkDocs plugins
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ env.CACHE_KEY_PREFIX }}-mkdocs-${{ hashFiles('mkdocs.yml', '**/*.md') }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-mkdocs-

      - name: Build and deploy
        run: |
          mkdocs gh-deploy --force
        continue-on-error: false